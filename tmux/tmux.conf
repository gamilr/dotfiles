# Mouse + vi-mode
set -g mouse on
set -g mode-keys vi

# ─── Clipboard: OSC52 (plugin-free, cross-platform, works over SSH) ───────────
# Ghostty / kitty / wezterm / alacritty / iTerm2 all support OSC52 natively.
set -g set-clipboard on
set -g allow-passthrough on
set -as terminal-features ',*:clipboard'

# Per-OS copy-command (fallback used by copy-pipe* commands)
if-shell '[ "$(uname)" = "Darwin" ]' \
  'set -s copy-command "pbcopy"'
if-shell '[ "$(uname)" = "Linux" ] && [ -n "$WAYLAND_DISPLAY" ]' \
  'set -s copy-command "wl-copy"'
if-shell '[ "$(uname)" = "Linux" ] && [ -z "$WAYLAND_DISPLAY" ]' \
  'set -s copy-command "xclip -selection clipboard -in"'

# ─── Copy bindings ────────────────────────────────────────────────────────────
# v / V / C-v — start selection (char / line / block)
bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi V   send -X select-line
bind -T copy-mode-vi C-v send -X begin-selection \; send -X rectangle-toggle

# Multiple intuitive yank triggers — all reach system clipboard via OSC52
bind -T copy-mode-vi y     send -X copy-pipe-and-cancel
bind -T copy-mode-vi Y     send -X copy-pipe-and-cancel
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel

# Mouse word / line / drag — copy AND keep selection visible (no jump-to-bottom)
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-no-clear
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send -X select-word \; send -X copy-pipe-no-clear
bind -T copy-mode-vi TripleClick1Pane select-pane \; send -X select-line \; send -X copy-pipe-no-clear
bind -n DoubleClick1Pane select-pane \; copy-mode -M \; send -X select-word \; send -X copy-pipe-no-clear
bind -n TripleClick1Pane select-pane \; copy-mode -M \; send -X select-line \; send -X copy-pipe-no-clear

# ─── Paste bindings ───────────────────────────────────────────────────────────
# Cmd+V (macOS) / Ctrl+Shift+V (Linux) → handled by Ghostty itself (system clipboard)
# Below are tmux-internal pastes (use the last yanked buffer):
bind   P     paste-buffer        # prefix + Shift+P  (existing)
bind -n M-v  paste-buffer        # Alt-v anywhere    (no prefix — parallels Alt-; for copy)
bind -n MouseDown2Pane paste-buffer   # middle-click paste

# nvim-style "jk-to-normal-mode" equivalent: Alt-j toggles copy mode
# (tmux can't bind raw chord sequences without breaking shell input; Alt-j is the closest single-key nod to the jk chord, home-row reachable)
bind -n M-j copy-mode
bind -T copy-mode-vi M-j send -X cancel
bind -T copy-mode-vi i send -X cancel
bind -T copy-mode-vi q send -X cancel

# gx: open URL on current line in default browser (mimics nvim's gx)
# 'g' enters a one-shot sub-table: 'gg' = top of history (default), 'gx' = open URL
bind -T copy-mode-vi g switch-client -T copy-mode-vi-g
bind -T copy-mode-vi-g g send -X history-top
bind -T copy-mode-vi-g x send -X select-line \; send -X copy-pipe-and-cancel "~/.config/tmux/scripts/open-url.sh"

# Split panes — \ (no shift) for right, - for below
bind '\' split-window -h -c "#{pane_current_path}"
bind -  split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
unbind '|'

# Terminal: truecolor + tmux-256color (matches Ghostty / modern Linux terms)
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Forward terminal focus in/out (CSI I / CSI O) to the running program.
# Main win: nvim FocusGained/FocusLost -> :checktime/autoread + cursor-shape restore.
# Minor: Claude Code enables CSI ?1004h and uses it only to stop inverting its
# prompt cursor block in unfocused panes. Harmless for everything else.
set -g focus-events on

# Reload config
bind r source-file "#{config_files}" \; display "tmux.conf reloaded"

# Don't rename windows automatically
set-option -g allow-rename off

# Scrollback buffer (matches nvim's scrollback = 50000 for consistency).
# ~3.7 MB per pane; trivial on modern machines.
set -g history-limit 50000

# ─── Everforest theme (matches nvim colorscheme) ──────────────────
# Palette:
#   bg_dim #232a2e  bg0 #2d353b  bg1 #343f44  bg2 #3d484d  bg3 #475258
#   fg #d3c6aa  grey0 #7a8478  grey1 #859289
#   green #a7c080  red #e67e80  orange #e69875  yellow #dbbc7f
#   blue #7fbbb3  aqua #83c092  purple #d699b6

# Pane borders — fg matches nvim VertSplit; active uses green accent
set -g pane-border-style 'fg=#495156'
set -g pane-active-border-style 'fg=#a7c080'

# Framed panes: per-pane header bar + heavier border lines.
# Header shows: active marker (■/□) · pane index · pane title (falls back to current command).
# Set a custom name with:  tmux select-pane -T "name"   (or  prefix + : select-pane -T name)
set -g pane-border-status top
set -g pane-border-format " #[fg=#a7c080]#{?pane_active,■,□} #[fg=#d3c6aa]#{pane_index} #[fg=#7a8478]#{?#{||:#{==:#{pane_title},#{host}},#{==:#{pane_title},#{host_short}}},#{pane_current_command},#{pane_title}} "
set -g pane-border-lines heavy

# Rename the current pane (prompts for a title) — mirrors prefix+, for windows
bind T command-prompt -p "pane title:" "select-pane -T '%%'"

# ─── Status bar (Dev Dashboard, Powerline-segmented, Nerd Font icons) ──────────
# Scripts live in ~/.config/tmux/scripts/ (symlinked from ~/dotfiles/tmux/scripts/).
# Requires a Nerd Font in your terminal to render icons + chevrons.
set -g status-justify left
set -g status-interval 5
set -g status-position bottom
set -g status-style 'bg=#1e2326,fg=#d3c6aa'
set -g status-left-length 120
set -g status-right-length 180

# Left: live-pane context (cwd basename + git branch with dirty/ahead-behind).
# Format:  dotfiles │  main *↑2
# (Session #, whoami, and pane_current_command were dropped — the first two are
#  static, and pane_current_command duplicates the window-list segment.)
set -g status-left "\
#[fg=#dbbc7f,bold] #{b:pane_current_path} \
#[fg=#475258]│\
#[fg=#83c092]  #(~/.config/tmux/scripts/git.sh '#{pane_current_path}') \
"

# Right: now-playing + metric segments with progress bars (value-driven color).
# Each metric script emits its own segment: label + ▓▓░░░░ bar + value.
# Format: ♪ Artist — Title │ cpu ▓▓░░░░ 23% │ ram ▓▓▓▓░░░░ 51% │ bat ▓▓▓▓▓▓▓░ 80%+ │ online │ Wed May 13 · 11:29
set -g status-right "\
#(~/.config/tmux/scripts/spotify.sh)\
 #(~/.config/tmux/scripts/cpu.sh) \
#[fg=#475258]│\
 #(~/.config/tmux/scripts/ram.sh) \
#[fg=#475258]│\
 #(~/.config/tmux/scripts/battery.sh) \
#[fg=#475258]│\
 #(~/.config/tmux/scripts/online.sh) \
#[fg=#475258]│\
#[fg=#a7c080,bold] %a %b %d · %H:%M \
"

# Escape-time of 10ms so nvim's Esc isn't noticeably delayed.
set-option -sg escape-time 10

# Messages
set -g message-command-style 'fg=#d3c6aa,bg=#3d484d'
set -g message-style 'fg=#2d353b,bg=#a7c080,bold'

# Copy/clock modes
setw -g mode-style 'bg=#a7c080,fg=#2d353b,bold'
setw -g clock-mode-colour '#a7c080'

# Window styles (active/inactive panes) — values pulled live from nvim:
#   :lua print(vim.api.nvim_get_hl(0, { name = 'Normal'/'NormalNC' }).bg)
# Active is Normal#bg, inactive is NormalNC#bg. Mirrors lua/custom/plugins/everforest.lua.
set -g window-style 'fg=#d3c6aa,bg=#23292d'
set -g window-active-style 'fg=#d3c6aa,bg=#1f2428'
setw -g window-status-current-style 'fg=#2d353b,bg=#a7c080,bold'
setw -g window-status-current-format ' #I:#W#F '
setw -g window-status-style 'fg=#d3c6aa,bg=#3d484d'
setw -g window-status-format ' #I:#W#F '
setw -g window-status-bell-style 'fg=#2d353b,bg=#e67e80,bold'
setw -g window-status-separator ''

# Quiet mode
set-option -g visual-activity off
set-option -g visual-bell off
set-option -g visual-silence off
set-window-option -g monitor-activity off
set-option -g bell-action none

# Resize panes via prefix + h/j/k/l (matches smart-splits resize in nvim)
unbind 'l'
bind k resize-pane -U 5
bind j resize-pane -D 5
bind h resize-pane -L 5
bind l resize-pane -R 5

# Remap clear screen so Ctrl-l still works inside shells
bind C-l send-keys 'C-l'

# Atuin shell history search: prefix + a sends Ctrl-R to the active pane.
# Works because `atuin init zsh` rebinds Ctrl-R to atuin's interactive search.
bind a send-keys 'C-r'

# Smart pane switching with awareness of Vim splits (vim-tmux-navigator compatible)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\\'  'select-pane -l'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l
